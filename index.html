<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>До 18 летия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            /* Красивый черный фон с легким градиентом */
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        .container {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            text-align: center;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 18px;
            font-weight: 400;
            color: #aaaaaa;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .time-block {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 15px 5px;
            border: 1px solid #222;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .time-block:hover {
            transform: translateY(-3px);
            border-color: #555;
        }

        .time-value {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            display: block;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            /* Анимация для цифр */
            animation: pulse 2s infinite alternate;
        }

        .time-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            display: block;
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            from { text-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
            to { text-shadow: 0 0 20px rgba(255, 255, 255, 0.4); }
        }

        /* Для очень маленьких экранов */
        @media (max-width: 360px) {
            .time-value { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>До 18-летия</h1>
        <div class="timer-grid">
            <div class="time-block">
                <span class="time-value" id="days">0</span>
                <span class="time-label">Дней</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="hours">0</span>
                <span class="time-label">Часов</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="minutes">0</span>
                <span class="time-label">Минут</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="seconds">0</span>
                <span class="time-label">Секунд</span>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand(); // Развернуть на весь экран
            // Устанавливаем цвет шапки Telegram в черный
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // Дата 18-летия (9 марта 2030 года)
        const targetDate = new Date(2030, 2, 9, 0, 0, 0).getTime(); 
        // Месяцы в JS начинаются с 0, поэтому 2 = Март

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                // Если время пришло
                document.querySelector('.timer-grid').innerHTML = '<h2 style="grid-column: span 2; color: #fff;">С Днём Рождения! 🎉</h2>';
                return;
            }

            // Вычисления
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Вывод на экран с добавлением нуля, если число меньше 10
            document.getElementById("days").textContent = days;
            document.getElementById("hours").textContent = String(hours).padStart(2, '0');
            document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
            document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
        }

        // Запускаем сразу и обновляем каждую секунду
        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
