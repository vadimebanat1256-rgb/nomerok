<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>До 18 летия</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            position: relative;
        }

        /* Снежинки на фоне */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы клики проходили сквозь снег */
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1; /* Чтобы карточка была поверх снега */
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.08), inset 0 0 20px rgba(255, 255, 255, 0.02);
            text-align: center;
            width: 90%;
            max-width: 420px;
            backdrop-filter: blur(12px);
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            font-size: 16px;
            font-weight: 400;
            color: #cccccc;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .time-block {
            background: #050505;
            border-radius: 16px;
            padding: 18px 5px;
            border: 1px solid #1a1a1a;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .time-block:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Свечение внутри блока */
        .time-block::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .time-block:hover::before {
            opacity: 1;
        }

        .time-value {
            font-size: 34px;
            font-weight: 700;
            color: #ffffff;
            display: block;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.15s ease;
            position: relative;
            z-index: 2;
        }

        /* Анимация прыжка при смене секунды */
        .time-value.flip {
            transform: translateY(-5px) scale(1.05);
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }

        .time-label {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            display: block;
            position: relative;
            z-index: 2;
        }

        /* Кнопки */
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Анимации */
        @keyframes cardAppear {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @media (max-width: 360px) {
            .time-value { font-size: 26px; }
            .container { padding: 25px 15px; }
        }
    </style>
</head>
<body>

    <!-- Холст для снежинок -->
    <canvas id="snow-canvas"></canvas>

    <div class="container">
        <h1>До 18-летия</h1>
        <div class="timer-grid">
            <div class="time-block">
                <span class="time-value" id="days">0</span>
                <span class="time-label">Дней</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="hours">0</span>
                <span class="time-label">Часов</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="minutes">0</span>
                <span class="time-label">Минут</span>
            </div>
            <div class="time-block">
                <span class="time-value" id="seconds">0</span>
                <span class="time-label">Секунд</span>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn" id="shareBtn">📤 Поделиться</button>
            <button class="btn" id="themeBtn">✨ Режим</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM
        // ==========================================
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // ==========================================
        // 2. ЛОГИКА ТАЙМЕРА
        // ==========================================
        const targetDate = new Date(2030, 2, 9, 0, 0, 0).getTime(); // 9 марта 2030
        
        // Элементы
        const elDays = document.getElementById("days");
        const elHours = document.getElementById("hours");
        const elMinutes = document.getElementById("minutes");
        const elSeconds = document.getElementById("seconds");

        // Функция для добавления анимации "прыжка"
        function triggerFlip(element) {
            element.classList.add('flip');
            setTimeout(() => element.classList.remove('flip'), 150);
        }

        function updateTimer() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.querySelector('.timer-grid').innerHTML = '<h2 style="grid-column: span 2; color: #fff; padding: 20px;">С Днём Рождения! 🎉</h2>';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Обновляем дни (без анимации, так как меняются редко)
            if (elDays.textContent !== String(days)) {
                elDays.textContent = days;
                triggerFlip(elDays);
            }

            // Обновляем часы
            const hoursStr = String(hours).padStart(2, '0');
            if (elHours.textContent !== hoursStr) {
                elHours.textContent = hoursStr;
                triggerFlip(elHours);
            }

            // Обновляем минуты
            const minutesStr = String(minutes).padStart(2, '0');
            if (elMinutes.textContent !== minutesStr) {
                elMinutes.textContent = minutesStr;
                triggerFlip(elMinutes);
            }

            // Обновляем секунды (с анимацией каждую секунду)
            const secondsStr = String(seconds).padStart(2, '0');
            if (elSeconds.textContent !== secondsStr) {
                elSeconds.textContent = secondsStr;
                triggerFlip(elSeconds);
            }
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // ==========================================
        // 3. СНЕЖИНКИ (Canvas)
        // ==========================================
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let snowflakes = [];
        let theme = 'snow'; // 'snow' или 'fire'

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Snowflake {
            constructor() {
                this.reset();
                this.y = Math.random() * height; // Начинаем сразу по всей высоте
            }
            reset() {
                this.x = Math.random() * width;
                this.y = -10;
                this.size = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.3;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                // Если упала вниз или улетела вбок, сбрасываем наверх
                if (this.y > height || this.x < 0 || this.x > width) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                if (theme === 'snow') {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                } else {
                    // Оранжевый режим "огня"
                    ctx.fillStyle = `rgba(255, ${Math.floor(100 + Math.random()*100)}, 0, ${this.opacity})`;
                }
                ctx.fill();
            }
        }

        // Создаем снежинки в зависимости от размера экрана
        function initSnow() {
            snowflakes = [];
            const count = Math.floor(width * height / 12000); // Количество снежинок
            for (let i = 0; i < count; i++) {
                snowflakes.push(new Snowflake());
            }
        }
        initSnow();

        function animateSnow() {
            ctx.clearRect(0, 0, width, height);
            snowflakes.forEach(flake => {
                flake.update();
                flake.draw();
            });
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        // ==========================================
        // 4. КНОПКИ (Функции)
        // ==========================================
        document.getElementById('shareBtn').addEventListener('click', () => {
            const text = "Смотри, какой у меня таймер до 18-летия! 🎂";
            if (tg) {
                // Если в Telegram, используем нативный шаринг
                tg.shareMessage("https://твой-сайт.github.io/countdown/", text);
            } else {
                // Если в обычном браузере, копируем ссылку
                navigator.clipboard.writeText(window.location.href);
                alert("Ссылка скопирована!");
            }
        });

        document.getElementById('themeBtn').addEventListener('click', () => {
            theme = theme === 'snow' ? 'fire' : 'snow';
            document.body.style.background = theme === 'fire' 
                ? 'radial-gradient(circle at center, #1a0a00 0%, #000 100%)' 
                : 'radial-gradient(circle at center, #0a0a0a 0%, #000 100%)';
            // Перекрашиваем снежинки
            snowflakes.forEach(f => f.reset()); 
        });
    </script>
</body>
</html>
