<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider OSINT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; color: #fff; padding: 20px; padding-bottom: 50px; overflow-x: hidden; }
        
        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .header h1 { font-size: 26px; color: #fff; font-weight: 900; letter-spacing: 1px;}
        .header h1 span { color: #ff0055; }
        .header p { font-size: 13px; color: #666; margin-top: 5px;}

        /* Поиск */
        .search-box { position: relative; margin-bottom: 30px; }
        .search-box input {
            width: 100%; padding: 18px 20px; font-size: 16px;
            background: #15151e; border: 1px solid #2a2a35; border-radius: 16px;
            color: #fff; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }
        .search-box button {
            position: absolute; right: 8px; top: 8px; bottom: 8px;
            width: 50px; border: none; border-radius: 12px;
            background: #ff0055; color: #fff; font-weight: bold; font-size: 18px;
            cursor: pointer; transition: 0.2s;
        }
        .search-box button:active { transform: scale(0.95); }

        /* Карточки */
        .results { display: flex; flex-direction: column; gap: 15px; }
        .card {
            background: #15151e; border-radius: 20px; padding: 20px;
            border: 1px solid #2a2a35; position: relative; overflow: hidden;
            opacity: 0; transform: translateY(20px);
            animation: slideUp 0.5s forwards;
        }
        /* Плавное появление с задержкой */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--color, #ff0055);
        }

        .card-title { font-size: 14px; color: var(--color, #ff0055); font-weight: 800; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px;}
        .card-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; border-bottom: 1px solid #22222d; padding-bottom: 8px; }
        .card-row:last-child { border: none; margin-bottom: 0; padding-bottom: 0; }
        .card-label { color: #888; }
        .card-val { font-weight: bold; color: #fff; text-align: right;}

        .link-btn { display: block; padding: 10px; background: #22222d; border-radius: 10px; text-align: center; color: #fff; text-decoration: none; font-size: 13px; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .link-btn:active { background: #33333d; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SPIDER <span>OSINT</span></h1>
        <p>Поиск по открытым источникам</p>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Номер, ник или ФИО...">
        <button onclick="search()">➔</button>
    </div>

    <div class="results" id="results">
        <!-- Сюда будут падать карточки -->
    </div>

    <script>
        Telegram.WebApp.ready();

        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            // Очищаем старые результаты
            const container = document.getElementById('results');
            container.innerHTML = '';
            
            // Вибрация (если поддерживается)
            if (Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium');

            // Имитация загрузки (0.5 сек)
            setTimeout(() => {
                renderCards(query);
            }, 500);
        }

        function renderCards(query) {
            const container = document.getElementById('results');
            
            // Карточка 1: Оператор (только если ввели цифры)
            if (/^\d+$/.test(query.replace('+', ''))) {
                const card1 = document.createElement('div');
                card1.className = 'card';
                card1.style.setProperty('--color', '#00ff88');
                card1.innerHTML = `
                    <div class="card-title">📱 Оператор связи</div>
                    <div class="card-row"><span class="card-label">Регион</span><span class="card-val">Россия</span></div>
                    <div class="card-row"><span class="card-label">Оператор</span><span class="card-val">МТС / Билайн</span></div>
                    <div class="card-row"><span class="card-label">Номер</span><span class="card-val">${query}</span></div>
                `;
                container.appendChild(card1);
            }

            // Карточка 2: Соцсети
            const card2 = document.createElement('div');
            card2.className = 'card';
            card2.style.setProperty('--color', '#00bfff');
            card2.innerHTML = `
                <div class="card-title">🌐 Поиск в соцсетях</div>
                <a href="https://vk.com/search?c[q]=${query}&c[section]=people" target="_blank" class="link-btn">Открыть поиск ВКонтакте</a>
                <a href="https://www.google.com/search?q=%22${query}%22+site:t.me" target="_blank" class="link-btn">Поиск в Telegram</a>
                <a href="https://www.google.com/search?q=%22${query}%22" target="_blank" class="link-btn">Поиск в Google</a>
            `;
            container.appendChild(card2);

            // Карточка 3: Фото
            const card3 = document.createElement('div');
            card3.className = 'card';
            card3.style.setProperty('--color', '#ffd700');
            card3.innerHTML = `
                <div class="card-title">📸 Поиск по фото</div>
                <a href="https://yandex.ru/images/search?text=${query}" target="_blank" class="link-btn">Искать в Яндекс.Картинках</a>
            `;
            container.appendChild(card3);

            // Карточка 4: Суды
            const card4 = document.createElement('div');
            card4.className = 'card';
            card4.style.setProperty('--color', '#ff0055');
            card4.innerHTML = `
                <div class="card-title">⚖️ Проверка в базах</div>
                <a href="https://sudrf.ru/index.php?id=300&searchtext=${query}" target="_blank" class="link-btn">Суды общей юрисдикции</a>
                <a href="https://www.google.com/search?q=%22${query}%22+Авито" target="_blank" class="link-btn">Поиск на Авито</a>
            `;
            container.appendChild(card4);
        }
    </script>
</body>
</html>
