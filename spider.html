<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSINT Profession Framework</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Segoe UI', monospace; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; }
        
        .header { 
            position: absolute; top: 0; left: 0; right: 0; z-index: 10; 
            padding: 15px; background: linear-gradient(180deg, #000 0%, transparent 100%);
            pointer-events: none; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 18px; font-weight: 900; color: #00bfff; letter-spacing: 1px;}
        .header p { font-size: 10px; color: #888; margin-top: 5px; }

        /* Область графа */
        #graph-container {
            width: 100vw; height: 100vh;
            cursor: grab;
        }
        #graph-container:active { cursor: grabbing; }

        /* Стили для линий */
        .link {
            fill: none;
            stroke: #444;
            stroke-width: 1.5px;
            transition: stroke 0.3s, stroke-width 0.3s;
        }
        .link.active {
            stroke: #00bfff;
            stroke-width: 2px;
            filter: drop-shadow(0 0 3px #00bfff);
        }

        /* Стили для узлов */
        .node circle {
            fill: #000;
            stroke: #555;
            stroke-width: 2px;
            transition: all 0.3s;
        }
        .node:hover circle { stroke: #00bfff; r: 7; }
        .node.active circle { stroke: #00bfff; fill: #002233; r: 7; filter: drop-shadow(0 0 8px #00bfff); }

        .node text {
            fill: #ccc;
            font-size: 11px;
            pointer-events: none;
            font-family: monospace;
        }
        .node.active text { fill: #fff; font-weight: bold; }

        /* Центральный узел */
        .center-node circle {
            fill: #111;
            stroke: #fff;
            stroke-width: 3px;
            r: 15;
        }
        .center-node text {
            fill: #fff;
            font-size: 12px;
            font-weight: bold;
        }

        /* Панель с деталями (сбоку) */
        .details-panel {
            position: absolute; top: 0; right: 0; bottom: 0; width: 85%;
            background: rgba(5, 5, 8, 0.95); border-left: 1px solid #00bfff;
            padding: 20px; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }
        .details-panel.open { transform: translateX(0); }
        
        .close-btn { position: absolute; top: 15px; right: 15px; background: #222; border: 1px solid #444; color: #fff; width: 30px; height: 30px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        
        .p-title { font-size: 20px; color: #00bfff; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .p-cat { font-size: 11px; color: #888; margin-bottom: 20px; }
        
        .info-block { margin-bottom: 15px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border-left: 2px solid #00bfff; }
        .info-label { font-size: 10px; color: #00bfff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .info-text { font-size: 13px; color: #ddd; line-height: 1.5; }
        
        .salary-big { font-size: 24px; color: #00ff88; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    </style>
</head>
<body>

    <div class="header">
        <h1>OSINT FRAMEWORK: CAREER</h1>
        <p>Нажми на узел для раскрытия информации</p>
    </div>

    <svg id="graph-container"></svg>

    <!-- Панель с деталями -->
    <div class="details-panel" id="detailsPanel">
        <button class="close-btn" onclick="closeDetails()">✕</button>
        <div class="p-title" id="dTitle">Название</div>
        <div class="p-cat" id="dCat">Категория</div>
        
        <div class="salary-big" id="dSalary">0 ₽</div>
        
        <div class="info-block">
            <div class="info-label">Чем занимается</div>
            <div class="info-text" id="dDesc">Описание...</div>
        </div>
        
        <div class="info-block">
            <div class="info-label">Что нужно сдать / знать</div>
            <div class="info-text" id="dExams">Экзамены...</div>
        </div>
        
        <div class="info-block">
            <div class="info-label">Как стать успешным</div>
            <div class="info-text" id="dSuccess">Советы...</div>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();

        // ================= БАЗА ДАННЫХ =================
        const data = {
            name: "ПРОФЕССИИ",
            type: "center",
            children: [
                {
                    name: "ОПАСНЫЕ",
                    type: "category",
                    children: [
                        { 
                            name: "Шахтер", type: "job", salary: "80 000 - 150 000 ₽",
                            desc: "Добыча угля и руды под землей. Работа в тяжелых условиях, с риском для жизни.",
                            exams: "ЕГЭ: Физика, Математика. Колледж по специальности 'Горное дело'.",
                            success: "Соблюдение ТБ, высокая выносливость, готовность к вахтам."
                        },
                        { 
                            name: "Пром. альпинист", type: "job", salary: "60 000 - 200 000 ₽",
                            desc: "Мойка окон небоскребов, ремонт крыш, монтаж конструкций на высоте.",
                            exams: "Курсы промальпинизма (2-3 недели). Медкомиссия.",
                            success: "Отсутствие страха высоты, идеальное здоровье, аккуратность."
                        },
                        { 
                            name: "Взрывотехник", type: "job", salary: "100 000 - 250 000 ₽",
                            desc: "Работа со взрывчаткой на карьерах или с неразорвавшимися снарядами.",
                            exams: "Высшее техническое или военное образование. Спецкурсы.",
                            success: "Хладнокровие, математический склад ума, безукоризненное соблюдение правил."
                        }
                    ]
                },
                {
                    name: "БОЛЬШИЕ ДЕНЬГИ",
                    type: "category",
                    children: [
                        { 
                            name: "IT-Архитектор", type: "job", salary: "250 000 - 500 000 ₽",
                            desc: "Проектирует сложные IT-системы, руководит разработчиками.",
                            exams: "ЕГЭ: Информатика, Математика. Опыт программирования от 5 лет.",
                            success: "Знание языков (Python, C++), понимание архитектуры, лидерские качества."
                        },
                        { 
                            name: "Пилот", type: "job", salary: "200 000 - 600 000 ₽",
                            desc: "Управление пассажирскими самолетами.",
                            exams: "Медкомиссия ВЛЭК, ЕГЭ (Физика, Математика), летное училище.",
                            success: "Идеальное здоровье, английский язык, стрессоустойчивость."
                        },
                        { 
                            name: "Стоматолог", type: "job", salary: "150 000 - 400 000 ₽",
                            desc: "Лечение зубов, протезирование, имплантация.",
                            exams: "ЕГЭ: Химия, Биология. Медицинский университет (6 лет + ординатура).",
                            success: "Твердая рука, усидчивость, умение работать с людьми."
                        }
                    ]
                },
                {
                    name: "IT и ТЕХНОЛОГИИ",
                    type: "category",
                    children: [
                        { 
                            name: "Кибербезопасник", type: "job", salary: "150 000 - 350 000 ₽",
                            desc: "Поиск уязвимостей, защита данных компаний от хакеров.",
                            exams: "ЕГЭ: Информатика, Математика. Курсы по PenTest.",
                            success: "Постоянное обучение, знание сетей, параноидальный склад ума."
                        },
                        { 
                            name: "Frontend-разраб", type: "job", salary: "100 000 - 250 000 ₽",
                            desc: "Создание интерфейсов сайтов и приложений (кнопки, меню).",
                            exams: "ЕГЭ: Информатика, Математика. Курсы веб-разработки.",
                            success: "Знание JS, React, умение верстать по макетам."
                        },
                        { 
                            name: "Геймдев", type: "job", salary: "80 000 - 200 000 ₽",
                            desc: "Разработка игр (от мобильных до AAA-проектов).",
                            exams: "ЕГЭ: Информатика. Знание Unity/Unreal Engine.",
                            success: "Портфолио с играми, математика (физика движения), креативность."
                        }
                    ]
                },
                {
                    name: "РАБОЧИЕ",
                    type: "category",
                    children: [
                        { 
                            name: "Электрик", type: "job", salary: "60 000 - 150 000 ₽",
                            desc: "Монтаж и ремонт электрических сетей, щитков, проводки.",
                            exams: "Колледж (специальность 'Электромонтер'). Группа по электробезопасности.",
                            success: "Знание ПУЭ, аккуратность, умение работать на себя (частные заказы)."
                        },
                        { 
                            name: "Сварщик НАКС", type: "job", salary: "100 000 - 250 000 ₽",
                            desc: "Сварка ответственных конструкций (нефтепроводы, газопроводы).",
                            exams: "Колледж + аттестация НАКС. Медкомиссия.",
                            success: "Твердая рука, опыт, готовность к командировкам/вахтам."
                        }
                    ]
                }
            ]
        };

        // ================= ЛОГИКА ГРАФА =================
        const width = window.innerWidth;
        const height = window.innerHeight;
        const centerX = width / 2;
        const centerY = height / 2;

        const svg = document.getElementById('graph-container');
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

        // Функция для отрисовки узла
        function createNode(x, y, label, className, onClick) {
            const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
            g.setAttribute("class", "node " + className);
            g.setAttribute("transform", `translate(${x}, ${y})`);
            g.style.cursor = "pointer";
            
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", className === 'center-node' ? 15 : 5);
            
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("text-anchor", "start");
            text.setAttribute("dx", "10");
            text.setAttribute("dy", "4");
            text.textContent = label;
            
            g.appendChild(circle);
            g.appendChild(text);
            
            if (onClick) g.addEventListener('click', onClick);
            svg.appendChild(g);
            
            return g;
        }

        // Функция для отрисовки линии
        function createLine(x1, y1, x2, y2) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // Изогнутая линия (квадратичная кривая)
            const midX = (x1 + x2) / 2;
            const midY = (y1 + y2) / 2;
            const d = `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`;
            path.setAttribute("d", d);
            path.setAttribute("class", "link");
            svg.appendChild(path);
            return path;
        }

        // Отрисовка центра
        const centerNode = createNode(centerX, centerY, data.name, "center-node");

        // Отрисовка 1-го уровня (Категории)
        const catsCount = data.children.length;
        const catRadius = Math.min(width, height) / 3;
        
        const categories = [];
        data.children.forEach((cat, i) => {
            const angle = (Math.PI * 2 / catsCount) * i - Math.PI / 2;
            const catX = centerX + catRadius * Math.cos(angle);
            const catY = centerY + catRadius * Math.sin(angle);
            
            const line = createLine(centerX, centerY, catX, catY);
            
            const node = createNode(catX, catY, cat.name, "category-node", function() {
                openCategory(cat, catX, catY, node, line);
            });
            
            categories.push({ node, line, x: catX, y: catY, data: cat });
        });

        let activeSubNodes = [];

        // Открытие категории
        function openCategory(catData, catX, catY, catNode, catLine) {
            // Сбрасываем предыдущие
            resetSubNodes();
            
            catNode.classList.add('active');
            catLine.classList.add('active');

            const jobsCount = catData.children.length;
            // Раскидываем профессии веером в сторону от центра
            const baseAngle = Math.atan2(catY - centerY, catX - centerX);
            const spread = Math.PI / 1.5; // Угол разброса

            catData.children.forEach((job, i) => {
                const angle = baseAngle - spread/2 + (spread / Math.max(jobsCount - 1, 1)) * i;
                const dist = 100; // Расстояние от категории
                
                const jobX = catX + dist * Math.cos(angle);
                const jobY = catY + dist * Math.sin(angle);

                const line = createLine(catX, catY, jobX, jobY);
                const node = createNode(jobX, jobY, job.name, "job-node", function() {
                    openDetails(job, catData.name);
                });

                activeSubNodes.push({ node, line });
            });
        }

        // Сброс веток профессий
        function resetSubNodes() {
            activeSubNodes.forEach(item => {
                item.node.remove();
                item.line.remove();
            });
            activeSubNodes = [];
            
            categories.forEach(c => {
                c.node.classList.remove('active');
                c.line.classList.remove('active');
            });
        }

        // Открытие панели с деталями
        function openDetails(job, catName) {
            document.getElementById('dTitle').innerText = job.name;
            document.getElementById('dCat').innerText = "Категория: " + catName;
            document.getElementById('dSalary').innerText = job.salary;
            document.getElementById('dDesc').innerText = job.desc;
            document.getElementById('dExams').innerText = job.exams;
            document.getElementById('dSuccess').innerText = job.success;
            
            document.getElementById('detailsPanel').classList.add('open');
            if (Telegram.WebApp.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }

        function closeDetails() {
            document.getElementById('detailsPanel').classList.remove('open');
        }

        // Таскание графа (Drag & Drop)
        let isDragging = false;
        let startX, startY, viewBoxX, viewBoxY;

        svg.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            const vb = svg.viewBox.baseVal;
            viewBoxX = vb.x;
            viewBoxY = vb.y;
        });

        svg.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            svg.setAttribute('viewBox', `${viewBoxX - dx} ${viewBoxY - dy} ${width} ${height}`);
        });

        svg.addEventListener('mouseup', () => isDragging = false);
        svg.addEventListener('mouseleave', () => isDragging = false);
        
        // Зум
        svg.addEventListener('wheel', (e) => {
            e.preventDefault();
            const vb = svg.viewBox.baseVal;
            const scale = e.deltaY > 0 ? 1.1 : 0.9;
            const newW = width * scale;
            const newH = height * scale;
            svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${newW} ${newH}`);
        }, { passive: false });

    </script>
</body>
</html>
